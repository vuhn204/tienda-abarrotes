services:
  app:
    image: ${APP_IMAGE:-ghcr.io/vuhn204/tienda-abarrotes:latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: ${DB_HOST:?Falta DB_HOST}
      DB_PORT: ${DB_PORT:?Falta DB_PORT}
      DB_USER: ${DB_USER:?Falta DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      DB_NAME: ${DB_NAME:?Falta DB_NAME}
      DB_SSL: "true"
      DB_SSL_CA: ${DB_SSL_CA:?Falta DB_SSL_CA}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s