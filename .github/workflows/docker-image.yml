name: Build and Deploy Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  package:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image name and tags
        id: meta
        run: |
          IMAGE=${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE:${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "tags=$IMAGE:latest,$IMAGE:${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: self-hosted
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: powershell
    env:
      APP_IMAGE: ${{ needs.package.outputs.image }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove container from the old workflow (if any)
        run: |
          $old = docker ps -aq --filter "name=^app$"
          if ($old) { docker rm -f $old | Out-Null }

      - name: Deploy with Docker Compose
        run: |
          docker compose pull app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker compose up -d --no-build --remove-orphans --wait --wait-timeout 180
          if ($LASTEXITCODE -ne 0) { docker compose logs --tail 100; exit $LASTEXITCODE }

      - name: Smoke test
        run: |
          $r = Invoke-RestMethod -Uri http://localhost:8080/health -TimeoutSec 10
          if ($r.estado -ne 'ok') { Write-Error "Health check fallo"; exit 1 }
          Write-Host "App OK en http://localhost:8080"

      - name: Clean up old images
        if: always()
        run: docker image prune -f

        
